<div class="card mx-auto my-5 text-center" style="max-width: 520px"><div class="card-body p-4">
  <div class="display-5 fw-bold {{ warna }}">{{ kode }}</div>
  <h1 class="h5 fw-bold mt-2">{{ judul }}</h1>
  <p class="text-secondary small">{{ pesan }}{% if kode == 403 %} Lihat <a href="{% url 'panduan' %}">panduan</a> untuk mengetahui apa yang bisa dilakukan peran Anda, atau hubungi admin bila peran/pokja Anda belum benar.{% endif %}</p>
  <div class="d-flex justify-content-center gap-2 mt-3">
    <a class="btn btn-primary" href="{% url 'beranda' %}">Ke Dashboard</a>
    {% if kode == 404 %}<a class="btn btn-outline-secondary" href="{% url 'cari' %}">Cari</a>{% endif %}
  </div>
</div></div>
