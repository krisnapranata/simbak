{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block judul %}Periode{% endblock %}
{% block konten %}
<a href="{% url 'penilaian:periode_list' %}" class="small"><i class="bi bi-arrow-left"></i> Periode</a>
<h1 class="judul-halaman mt-2 mb-3">{% if object %}Ubah periode{% else %}Periode baru{% endif %}</h1>
<div class="card" style="max-width: 720px"><div class="card-body">
  <form method="post">{% csrf_token %}{{ form|crispy }}<button class="btn btn-primary">Simpan</button></form>
</div></div>
{% endblock %}
