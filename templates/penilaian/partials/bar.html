{# Bar capaian: nilai = persen (0–100) atau None #}
{% if nilai is None %}<span class="small text-secondary">–</span>{% else %}
<div class="bar-capaian">
  <div class="progress" role="progressbar" aria-valuenow="{{ nilai|floatformat:0 }}" aria-valuemin="0" aria-valuemax="100">
    <div class="progress-bar {% if nilai >= 80 %}bg-success{% elif nilai >= 60 %}bg-warning{% else %}bg-danger{% endif %}" style="width: {{ nilai|floatformat:0 }}%"></div>
  </div>
  <span class="angka small">{{ nilai|floatformat:1 }}%</span>
</div>{% endif %}
