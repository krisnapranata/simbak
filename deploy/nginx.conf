# Nginx internal SIMBAK (container simbak_nginx, port host 8030).
# Di depannya: Nginx Proxy Manager yang memegang domain + sertifikat HTTPS.

# Teruskan protokol asli dari Nginx Proxy Manager; bila diakses langsung, pakai $scheme.
map $http_x_forwarded_proto $proto_asli {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    # Backend dipanggil dengan NAMA CONTAINER yang unik (simbak_web), bukan nama service "web":
    # simbak_nginx juga tergabung di network Nginx Proxy Manager, tempat aplikasi lain bisa
    # punya service bernama "web" juga. Resolver Docker + variabel membuat alamat dibaca ulang
    # (valid=10s) sehingga tetap benar setelah simbak_web dibuat ulang dengan IP baru.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $simbak_web http://simbak_web:8000;

    # Percayai X-Real-IP hanya dari jaringan privat (NPM/docker), untuk log & kunci login.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Sedikit di atas UPLOAD_MAKS_MB (25 MB). Samakan di Nginx Proxy Manager.
    client_max_body_size 30m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # File bukti: HANYA lewat header X-Accel-Redirect dari Django setelah cek izin.
    location /_privat/ {
        internal;
        alias /srv/media_private/;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        proxy_pass $simbak_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_asli;
        proxy_read_timeout 180s;   # ekspor ZIP/PDF per bab bisa lama
        proxy_send_timeout 180s;
    }
}
